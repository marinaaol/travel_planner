<!DOCTYPE html>
<html lang="pt-PT">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Entrar - VOYAGE</title>

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
        <style>
        :root {
            --ink: #142440;
            --paper: #fffaf0;
            --sky: #dceff5;
            --red: #d8473b;
            --blue: #2264a8;
            --gold: #e7a93e;
            --line: #c8d5dc;
            --muted: #5d6878;
            --display: "Big Shoulders Display", sans-serif;
            --body: "Work Sans", sans-serif;
            --mono: "IBM Plex Mono", monospace;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            background: var(--sky);
            color: var(--ink);
            font-family: var(--body);
        }

        main {
            width: min(100%, 480px);
        }

        section {
            position: relative;
            overflow: hidden;
            padding: 38px;
            background: var(--paper);
            border: 1px solid var(--line);
            border-radius: 20px;
            box-shadow: 0 18px 40px rgba(20, 36, 64, 0.16);
        }

        section::before {
            content: "VOYAGE";
            position: absolute;
            top: -20px;
            right: -8px;
            color: rgba(34, 100, 168, 0.08);
            font: 800 6rem/1 var(--display);
            pointer-events: none;
        }

        section > * {
            position: relative;
        }

        a {
            color: var(--blue);
            font-weight: 700;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        section > a {
            display: inline-block;
            margin-bottom: 28px;
            color: var(--muted);
            font-size: 0.9rem;
        }

        section > p:first-of-type {
            margin: 0 0 7px;
            color: var(--red);
            font: 600 0.72rem var(--mono);
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font: 800 clamp(3rem, 10vw, 4.4rem) / 0.85 var(--display);
        }

        h1 + p {
            margin: 14px 0 28px;
            color: var(--muted);
            line-height: 1.55;
        }

        form {
            display: grid;
            gap: 17px;
        }

        form > div {
            display: grid;
            gap: 7px;
        }

        label {
            color: var(--muted);
            font: 600 0.72rem var(--mono);
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--line);
            border-radius: 9px;
            background: #fffdf9;
            color: var(--ink);
            font: inherit;
        }

        input:focus {
            outline: 3px solid rgba(34, 100, 168, 0.2);
            border-color: var(--blue);
        }

        button {
            border: 0;
            border-radius: 9px;
            padding: 13px 18px;
            background: var(--red);
            color: white;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.15s ease, background 0.15s ease;
        }

        button:hover {
            background: #b93b31;
            transform: translateY(-2px);
        }

        #mensagem {
            min-height: 1.3rem;
            margin: -5px 0 0;
            color: var(--red);
            font-size: 0.85rem;
        }

        form + p {
            margin: 25px 0 0;
            color: var(--muted);
            text-align: center;
            font-size: 0.9rem;
        }

        @media (max-width: 480px) {
            body {
            padding: 16px;
            }

            section {
            padding: 28px 22px;
            }
        }
        </style>
</head>
<body>
    <main>
        <section aria-labelledby="titulo-login">
            <a href="index.html">← Voltar ao início</a>

            <p>VOYAGE · painel de bordo</p>
            <h1 id="titulo-login">Bem-vinda de volta.</h1>
            <p>Entre para gerir os seus roteiros e atividades.</p>

            <form id="login-form">
                <div>
                    <label for="email">E-mail</label>
                    <input
                        id="email"
                        name="email"
                        type="email"
                        autocomplete="email"
                        required
                        placeholder="nome@exemplo.com"
                    >
                </div>
                <div>
                    <label for="senha">Palavra-passe</label>
                    <input
                        id="senha"
                        name="senha"
                        type="password"
                        autocomplete="current-password"
                        required
                        placeholder="A sua palavra-passe"
                    >    
                </div>
                <p id="mensagem" role="alert" aria-live="polite"></p>
                <button type="submit">Entrar no VOYAGE</button>
            </form>

            <p>
                Ainda não tem conta?
                <a href="registo.html">Criar conta grátis</a>
            </p>
        </section>
    </main>
    <script>
    // Endereço-base da API que está a correr localmente.
    const API_URL = "http://localhost:5057/api";

    // Seleciona os elementos do formulário pelo respetivo id.
    const formulario = document.querySelector("#login-form");
    const email = document.querySelector("#email");
    const senha = document.querySelector("#senha");
    const mensagem = document.querySelector("#mensagem");

    formulario.addEventListener("submit", async (evento) => {
        // Impede o recarregamento normal da página ao submeter o formulário.
        evento.preventDefault();

        mensagem.textContent = "";

        const botao = formulario.querySelector("button[type='submit']");
        botao.disabled = true;
        botao.textContent = "A entrar...";

        try {
        // Envia as credenciais para o endpoint de login da API.
        const resposta = await fetch(`${API_URL}/usuarios/login`, {
            method: "POST",
            headers: {
            "Content-Type": "application/json"
            },
            body: JSON.stringify({
            email: email.value.trim(),
            senha: senha.value
            })
        });

        // Converte a resposta JSON da API num objeto JavaScript.
        const dados = await resposta.json().catch(() => ({}));

        if (!resposta.ok) {
            throw new Error(
            dados.message || "Não foi possível iniciar sessão."
            );
        }

        // localStorage é uma pequena gaveta no navegador.
        // Guardamos o token para o enviar depois nos pedidos protegidos.
        localStorage.setItem("voyage_token", dados.token);

        // Guardamos apenas informação pública para mostrar no painel.
        localStorage.setItem(
            "voyage_utilizador",
            JSON.stringify(dados.utilizador)
        );

        // Login concluído: segue para o painel de roteiros.
        window.location.href = "planner.html";
        } catch (erro) {
        mensagem.textContent = erro.message;
        } finally {
        // Reativa o botão, mesmo que tenha ocorrido um erro.
        botao.disabled = false;
        botao.textContent = "Entrar no VOYAGE";
        }
    });
    </script>
</body>
</html>
