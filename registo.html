<!DOCTYPE html>
<html lang="pt-PT">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Entrar - VOYAGE</title>

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
        <style>
        :root {
            --ink: #142440;
            --paper: #fffaf0;
            --sky: #dceff5;
            --red: #d8473b;
            --blue: #2264a8;
            --gold: #e7a93e;
            --line: #c8d5dc;
            --muted: #5d6878;
            --display: "Big Shoulders Display", sans-serif;
            --body: "Work Sans", sans-serif;
            --mono: "IBM Plex Mono", monospace;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            background: var(--sky);
            color: var(--ink);
            font-family: var(--body);
        }

        main {
            width: min(100%, 480px);
        }

        section {
            position: relative;
            overflow: hidden;
            padding: 38px;
            background: var(--paper);
            border: 1px solid var(--line);
            border-radius: 20px;
            box-shadow: 0 18px 40px rgba(20, 36, 64, 0.16);
        }

        section::before {
            content: "VOYAGE";
            position: absolute;
            top: -20px;
            right: -8px;
            color: rgba(34, 100, 168, 0.08);
            font: 800 6rem/1 var(--display);
            pointer-events: none;
        }

        section > * {
            position: relative;
        }

        a {
            color: var(--blue);
            font-weight: 700;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        section > a {
            display: inline-block;
            margin-bottom: 28px;
            color: var(--muted);
            font-size: 0.9rem;
        }

        section > p:first-of-type {
            margin: 0 0 7px;
            color: var(--red);
            font: 600 0.72rem var(--mono);
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font: 800 clamp(3rem, 10vw, 4.4rem) / 0.85 var(--display);
        }

        h1 + p {
            margin: 14px 0 28px;
            color: var(--muted);
            line-height: 1.55;
        }

        form {
            display: grid;
            gap: 17px;
        }

        form > div {
            display: grid;
            gap: 7px;
        }

        label {
            color: var(--muted);
            font: 600 0.72rem var(--mono);
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--line);
            border-radius: 9px;
            background: #fffdf9;
            color: var(--ink);
            font: inherit;
        }

        input:focus {
            outline: 3px solid rgba(34, 100, 168, 0.2);
            border-color: var(--blue);
        }

        button {
            border: 0;
            border-radius: 9px;
            padding: 13px 18px;
            background: var(--red);
            color: white;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.15s ease, background 0.15s ease;
        }

        button:hover {
            background: #b93b31;
            transform: translateY(-2px);
        }

        #mensagem {
            min-height: 1.3rem;
            margin: -5px 0 0;
            color: var(--red);
            font-size: 0.85rem;
        }

        form + p {
            margin: 25px 0 0;
            color: var(--muted);
            text-align: center;
            font-size: 0.9rem;
        }

        @media (max-width: 480px) {
            body {
            padding: 16px;
            }

            section {
            padding: 28px 22px;
            }
        }
        </style>
</head>
<body>
  <main>
    <section aria-labelledby="titulo-registo">
      <a href="index.html">← Voltar ao início</a>

      <p>VOYAGE · novo embarque</p>
      <h1 id="titulo-registo">Comece a viagem.</h1>
      <p>Crie a sua conta para guardar roteiros e atividades.</p>

      <form id="registo-form">
        <div>
          <label for="nome">Nome</label>
          <input
            id="nome"
            name="nome"
            type="text"
            autocomplete="name"
            required
            maxlength="100"
            placeholder="O seu nome"
          >
        </div>

        <div>
          <label for="email">E-mail</label>
          <input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            required
            placeholder="nome@exemplo.com"
          >
        </div>

        <div>
          <label for="senha">Palavra-passe</label>
          <input
            id="senha"
            name="senha"
            type="password"
            autocomplete="new-password"
            required
            minlength="8"
            placeholder="Mínimo de 8 caracteres"
          >
        </div>

        <div>
          <label for="confirmar-senha">Confirmar palavra-passe</label>
          <input
            id="confirmar-senha"
            name="confirmar-senha"
            type="password"
            autocomplete="new-password"
            required
            minlength="8"
            placeholder="Repita a palavra-passe"
          >
        </div>

        <p id="mensagem" role="alert" aria-live="polite"></p>

        <button type="submit">Criar conta grátis</button>
      </form>

      <p>
        Já tem conta?
        <a href="login.html">Entrar no VOYAGE</a>
      </p>
    </section>
  </main>

  <script>
    const API_URL = "http://localhost:5057/api";

    const formulario = document.querySelector("#registo-form");
    const nome = document.querySelector("#nome");
    const email = document.querySelector("#email");
    const senha = document.querySelector("#senha");
    const confirmarSenha = document.querySelector("#confirmar-senha");
    const mensagem = document.querySelector("#mensagem");

    formulario.addEventListener("submit", async (evento) => {
      evento.preventDefault();
      mensagem.textContent = "";

      // Primeiro validamos no navegador se as duas palavras-passe coincidem.
      if (senha.value !== confirmarSenha.value) {
        mensagem.textContent = "As palavras-passe não coincidem.";
        return;
      }

      const botao = formulario.querySelector("button[type='submit']");
      botao.disabled = true;
      botao.textContent = "A criar conta...";

      try {
        // A API recebe apenas nome, e-mail e senha.
        // A confirmação serve apenas para melhorar a experiência no front-end.
        const resposta = await fetch(`${API_URL}/usuarios/registo`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            nome: nome.value.trim(),
            email: email.value.trim(),
            senha: senha.value
          })
        });

        const dados = await resposta.json().catch(() => ({}));

        if (!resposta.ok) {
          throw new Error(
            dados.message || "Não foi possível criar a conta."
          );
        }

        mensagem.style.color = "#2264a8";
        mensagem.textContent = "Conta criada! Agora pode iniciar sessão.";

        // Dá tempo para a pessoa ler a confirmação antes de ir ao login.
        setTimeout(() => {
          window.location.href = "login.html";
        }, 1500);
      } catch (erro) {
        mensagem.style.color = "";
        mensagem.textContent = erro.message;
      } finally {
        botao.disabled = false;
        botao.textContent = "Criar conta grátis";
      }
    });
  </script>
</body>
</html>
